  <title>Megaminx Image Editor 2.0</title>
  <style>
    .sticker-swatch {
      display: block;
      width: 100%;
      height: calc(1.5em + .75rem + 2px);
      padding: 0;
      border: 1px solid #ced4da;
      border-radius: .25rem;
    }
    .sticker-swatch:focus {
      outline: none;
      box-shadow: 0 0 0 .2rem rgba(0, 123, 255, .25);
    }
    .sticker-palette {
      position: absolute;
      z-index: 1000;
      display: grid;
      grid-template-columns: repeat(7, 28px);
      gap: 6px;
      padding: 8px;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, .15);
      border-radius: .25rem;
      box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15);
    }
    .sticker-palette[hidden] {
      display: none;
    }
    .sticker-palette-color {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid #adb5bd;
      border-radius: .2rem;
    }
    .sticker-palette-color.selected {
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px #007bff;
    }
  </style>
</head>
